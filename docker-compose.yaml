services:
  db:
    image: postgres:18
    container_name: api_db
    restart: always
    environment:
      POSTGRES_DB: api_db
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: api_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: